name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: bash -n
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: guard tests
        run: make test
